# Pipeline CI/CD del SIGR: build -> pruebas y cobertura -> seguridad -> staging.
name: CI/CD SIGR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pruebas:
    name: 1. Build, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar las 45 pruebas (unitarias, integración y UI)
        run: ./mvnw -B -ntp verify

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {m+=$4; c+=$5} END {printf "### Cobertura JaCoCo\n\nInstrucciones cubiertas: **%.1f %%** (umbral mínimo: 80 %%)\n", 100*c/(m+c)}' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/evidencias/

      - name: Publicar el JAR
        uses: actions/upload-artifact@v7
        with:
          name: sigr-jar
          path: target/sigr-*.jar

  seguridad:
    name: 2. Análisis de seguridad de dependencias
    runs-on: ubuntu-latest
    needs: build-pruebas
    steps:
      - uses: actions/checkout@v7

      - name: Escanear dependencias con Trivy (falla con vulnerabilidades críticas)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  staging:
    name: 3. Imagen Docker y despliegue a staging
    runs-on: ubuntu-latest
    needs: [build-pruebas, seguridad]
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Descargar el JAR probado
        uses: actions/download-artifact@v8
        with:
          name: sigr-jar
          path: target

      - name: Construir la imagen
        run: docker build -t sigr:${{ github.sha }} .

      - name: Escanear la imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sigr:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Desplegar en staging
        run: |
          docker run -d --name sigr-staging -p 8080:8080 sigr:${{ github.sha }}
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sigr-staging)" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f 'Estado del contenedor: {{.State.Health.Status}}' sigr-staging

      - name: Prueba de humo
        run: |
          curl -fsS http://localhost:8080/api/platos | python3 -c "import sys,json; p=json.load(sys.stdin); print(len(p),'platos'); assert len(p)==5"
          curl -fsS -o /dev/null -w "Login web: %{http_code}\n" http://localhost:8080/login

      - name: Prueba de rendimiento (k6)
        run: docker run --rm --network host -v "$PWD/perf:/perf" grafana/k6:0.54.0 run /perf/humo-rendimiento.js

      - name: Registros del contenedor si algo falla
        if: failure()
        run: docker logs sigr-staging
